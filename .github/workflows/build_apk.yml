name: Build Release APK

# 任何一次 push 到 main/master 都会自动构建 release APK，
# 并把 APK 作为 Artifact 上传；打 v* 标签时额外把 APK 挂到 GitHub Release。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时需要创建 Release

jobs:
  build-apk:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter SDK（带缓存）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 打印环境信息
        run: flutter --version && java -version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        # 只把 error/严重问题判为失败，info 级 lint 不阻断构建
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 release APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: 查看产物
        run: ls -lh build/app/outputs/flutter-apk/

      - name: 上传 APK 作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: color-grader-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 打标签时附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
